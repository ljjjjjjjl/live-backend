# ============================================================================
# RocketMQ Broker 本地开发配置（单机、演示用）
#
# 用法（先起 NameServer）：
#     cd D:\rocketmq\rocketmq-all-5.5.1-bin-release\bin
#     mqnamesrv.cmd
#     mqbroker.cmd -n 127.0.0.1:9876 -c D:\nodejs\workspace\live-backend\docs\rocketmq\broker.conf
#
# 注意：下面的 storePathRootDir 是<b>本机绝对路径</b>，换机器要改。
# 之所以不放在 %USERPROFILE%\store（默认值）：
#   ① 项目内的 .tmp/ 已被 .gitignore 忽略，不会污染仓库；
#   ② 某些受限环境下用户目录不可写，broker 会启动失败。
#
# 关于 Java 21：RocketMQ 5.5.1 在 Temurin 21 上可以正常启动
# （NameServer 与 Broker 均验证通过）。若报 RocksDB 无法加载原生库，
# 是因为它要把 .dll 解压到 java.io.tmpdir，把临时目录指到一个可写位置即可：
#     set JAVA_OPT_EXT=-Djava.io.tmpdir=D:/nodejs/workspace/live-backend/.tmp/javatmp
# ============================================================================

brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0

# 单机演示：异步刷盘、异步复制，追求吞吐而不是断电不丢
flushDiskType=ASYNC_FLUSH
brokerRole=ASYNC_MASTER
deleteWhen=04
fileReservedTime=48

namesrvAddr=127.0.0.1:9876
# 显式绑回环地址：不配的话 NameServer 会把 broker 注册成局域网 IP，本机客户端有时连不上
brokerIP1=127.0.0.1
listenPort=10911

# 演示方便：发消息时 topic 不存在就自动创建
# ⚠️ 生产环境必须关掉并预建 topic —— 否则任何人都能随意制造 topic 把元数据撑乱
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true

storePathRootDir=D:/nodejs/workspace/live-backend/.tmp/rocketmq/store
storePathCommitLog=D:/nodejs/workspace/live-backend/.tmp/rocketmq/store/commitlog
